  <text x="38" y="492" fill="#AFC7D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Edificio 23 · Arriendos, consumos, pagos y salidas en un solo lugar.</text>
  <text x="38" y="530" fill="#7899B1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="2">UNA PLATAFORMA DE CROHNOZ LABS</text>
