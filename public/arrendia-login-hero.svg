<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Arrendía, administración inteligente de arriendos</title>
  <desc id="desc">Identidad visual del sistema privado de administración del Edificio 23.</desc>
  <defs>
    <linearGradient id="hero-mark" x1="26" y1="18" x2="136" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C527B"/>
      <stop offset="0.58" stop-color="#103451"/>
      <stop offset="1" stop-color="#0A2238"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="47" y1="118" x2="124" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D7AE"/>
      <stop offset="1" stop-color="#C0F8E1"/>
    </linearGradient>
    <linearGradient id="hero-line" x1="84" y1="420" x2="690" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73E0BC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#73E0BC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g opacity="0.24" fill="none" stroke="#9AC2DF">
    <path d="M420 10v510M515 10v510M610 10v510M705 10v510"/>
    <path d="M380 120h350M380 215h350M380 310h350M380 405h350"/>
  </g>

  <g transform="translate(34 34)">
