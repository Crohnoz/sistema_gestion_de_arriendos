<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Arrendía, administración inteligente de arriendos</title>
  <desc id="desc">Identidad visual animada del sistema privado de administración del Edificio 23.</desc>
  <defs>
    <linearGradient id="hero-shell" x1="30" y1="16" x2="142" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22628F"/>
      <stop offset="0.5" stop-color="#123F61"/>
      <stop offset="1" stop-color="#081F34"/>
    </linearGradient>
    <linearGradient id="hero-a" x1="48" y1="40" x2="110" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8EAF5"/>
    </linearGradient>
    <linearGradient id="hero-orbit" x1="34" y1="128" x2="122" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32C999"/>
      <stop offset="0.58" stop-color="#75E2BD"/>
      <stop offset="1" stop-color="#C7F9E7"/>
    </linearGradient>
    <linearGradient id="hero-line" x1="38" y1="446" x2="690" y2="446" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73E0BC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#73E0BC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="0" cy="0" r="1" gradientTransform="translate(106 42) rotate(132) scale(75 68)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82E7C5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#82E7C5" stop-opacity="0"/>
    </radialGradient>
    <filter id="hero-mark-shadow" x="-35%" y="-35%" width="175%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020D18" flood-opacity="0.42"/>
    </filter>
    <filter id="hero-orbit-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    #hero-grid{animation:hero-grid-enter 1.2s ease-out .2s both}
    #hero-mark-group{transform-origin:100px 100px;animation:hero-mark-enter .8s cubic-bezier(.2,.82,.25,1) both,hero-mark-float 6.4s ease-in-out 1.2s infinite}
    #hero-a-main{stroke-dasharray:235;stroke-dashoffset:235;animation:hero-draw-a 1s cubic-bezier(.2,.72,.3,1) .18s forwards}
    #hero-a-bar{stroke-dasharray:52;stroke-dashoffset:52;animation:hero-draw-bar .45s ease-out .78s forwards}
    #hero-door{opacity:0;transform-origin:101px 116px;animation:hero-door-enter .42s ease-out .88s forwards}
    #hero-orbit-path{stroke-dasharray:138;stroke-dashoffset:138;animation:hero-draw-orbit 1.1s cubic-bezier(.2,.72,.25,1) .58s forwards}
    #hero-orbit-tip{opacity:0;transform-origin:126px 59px;animation:hero-tip-enter .38s ease-out 1.3s forwards}
    #hero-title,#hero-subtitle,#hero-pills,#hero-footer{opacity:0;animation:hero-copy-enter .72s ease-out forwards}
    #hero-title{animation-delay:.36s}
    #hero-subtitle{animation-delay:.48s}
    #hero-pills{animation-delay:.62s}
    #hero-footer{animation-delay:.76s}
    #hero-shine{opacity:0;animation:hero-shine 6.2s ease-in-out 1.8s infinite}
    @keyframes hero-grid-enter{from{opacity:0}to{opacity:.24}}
    @keyframes hero-mark-enter{from{opacity:0;transform:translateY(14px) scale(.86) rotate(-4deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
    @keyframes hero-mark-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.012)}}
    @keyframes hero-draw-a{to{stroke-dashoffset:0}}
    @keyframes hero-draw-bar{to{stroke-dashoffset:0}}
    @keyframes hero-door-enter{from{opacity:0;transform:translateY(6px) scaleY(.74)}to{opacity:1;transform:translateY(0) scaleY(1)}}
    @keyframes hero-draw-orbit{to{stroke-dashoffset:0}}
    @keyframes hero-tip-enter{from{opacity:0;transform:scale(.3) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes hero-copy-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes hero-shine{0%,70%,100%{opacity:0;transform:translateX(-28px)}78%{opacity:.72}90%{opacity:0;transform:translateX(42px)}}
    @media (prefers-reduced-motion:reduce){
      #hero-grid,#hero-mark-group,#hero-a-main,#hero-a-bar,#hero-door,#hero-orbit-path,#hero-orbit-tip,#hero-title,#hero-subtitle,#hero-pills,#hero-footer,#hero-shine{animation:none!important;opacity:1;stroke-dashoffset:0;transform:none}
    }
  </style>

  <g id="hero-grid" opacity="0" fill="none" stroke="#9AC2DF">
    <path d="M420 10v510M515 10v510M610 10v510M705 10v510"/>
    <path d="M380 120h350M380 215h350M380 310h350M380 405h350"/>
  </g>

  <g id="hero-mark-group" transform="translate(34 24)" filter="url(#hero-mark-shadow)">
    <path d="M39 5h72c18 0 31 13.8 31 31.8v56.4c0 25.8-17.4 40.2-67 49.2-49.6-9-67-23.4-67-49.2V36.8C8 18.8 21 5 39 5Z" fill="url(#hero-shell)"/>
    <path d="M39.5 6.5h71c17 0 30 13 30 30v55.8c0 24.4-16.5 37.8-65.5 46.8C26 130.1 9.5 116.7 9.5 92.3V36.5c0-17 13-30 30-30Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M20 31c32-21 76-20 110 2v28c-32-15-73-15-110 0V31Z" fill="url(#hero-glow)"/>
    <path id="hero-a-main" d="M34 112 67 42c2.8-5.8 11.4-5.8 14.2 0L115 112" fill="none" stroke="url(#hero-a)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="hero-a-bar" d="M53 88h44" fill="none" stroke="url(#hero-a)" stroke-width="10" stroke-linecap="round"/>
    <path id="hero-door" d="M65 115V98.7c0-5.8 4.4-10.2 9.8-10.2s9.8 4.4 9.8 10.2V115" fill="#0B2A43" stroke="#A9D8EE" stroke-opacity="0.3" stroke-width="2"/>
    <path id="hero-orbit-path" d="M30 119c24-4 52-20 83-59" fill="none" stroke="url(#hero-orbit)" stroke-width="12" stroke-linecap="round" filter="url(#hero-orbit-glow)"/>
    <path id="hero-orbit-tip" d="M103 63 120 53l-4.5 18.2c-4.5-2.8-8-5.7-12.5-8.2Z" fill="#C7F9E7"/>
    <path id="hero-shine" d="M30 35 68 17" fill="none" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="hero-title">
    <text x="34" y="246" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="84" font-weight="760" letter-spacing="-3">Arrendía</text>
  </g>
  <g id="hero-subtitle">
    <text x="38" y="296" fill="#C9DCEB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500">Administración inteligente, simple y segura.</text>
  </g>

  <g id="hero-pills" transform="translate(36 344)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="178" height="58" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <circle cx="28" cy="29" r="8" fill="#75E1BD"/>
    <text x="48" y="36" fill="#F7FBFF" font-size="18" font-weight="650">Cobros claros</text>

    <rect x="192" y="0" width="184" height="58" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <circle cx="220" cy="29" r="8" fill="#75E1BD"/>
    <text x="240" y="36" fill="#F7FBFF" font-size="18" font-weight="650">Datos privados</text>

    <rect x="390" y="0" width="222" height="58" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <circle cx="418" cy="29" r="8" fill="#75E1BD"/>
    <text x="438" y="36" fill="#F7FBFF" font-size="18" font-weight="650">Guardado automático</text>
  </g>

  <g id="hero-footer">
    <path d="M38 446h640" stroke="url(#hero-line)" stroke-width="2"/>
    <text x="38" y="492" fill="#AFC7D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Edificio 23 · Arriendos, consumos, pagos y salidas en un solo lugar.</text>
    <text x="38" y="530" fill="#7899B1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="2">UNA PLATAFORMA DE CROHNOZ LABS</text>
  </g>
</svg>