    <rect x="1" y="1" width="130" height="130" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M27 105 59 39c1.8-3.8 7.3-3.8 9.1 0L101 105" fill="none" stroke="#F7FBFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 82h40" fill="none" stroke="#F7FBFF" stroke-width="9" stroke-linecap="round"/>
    <path d="M32 108c20-5 40-18 62-47" fill="none" stroke="url(#hero-accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="m86 62 10-4-1 11" fill="none" stroke="#C0F8E1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

