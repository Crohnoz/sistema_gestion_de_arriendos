name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - hotfix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate demo seed
        run: node scripts/validate-demo-seed.mjs

      - name: Build demo
        env:
          VITE_APP_MODE: demo
        run: npm run build

      - name: Build private shell
        env:
          VITE_APP_MODE: private
          VITE_PRODUCT_NAME: Administración Edificio 23
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-publishable-key
        run: npm run build

      - name: Upload private build
        uses: actions/upload-artifact@v4
        with:
          name: private-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
